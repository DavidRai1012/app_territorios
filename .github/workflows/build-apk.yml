name: Generar APK Android

on:
  push:
    branches: [ main, prueba-giroscopio ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK de Territorios
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Detectar carpeta de la app
        run: |
          if [ -f package.json ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f app_base/package.json ]; then
            echo "APP_DIR=app_base" >> "$GITHUB_ENV"
          else
            echo "::error::No encuentro package.json ni en la raíz del repo ni en app_base/"
            exit 1
          fi

      # Capacitor 8 exige Node 22 o superior (con Node 20 el CLI se detiene en 'cap add android').
      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 compila con Java 21.
      - name: 4. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 5. Instalar dependencias y compilar la web
        working-directory: ${{ env.APP_DIR }}
        run: |
          node -v
          npm -v
          java -version
          npm install --legacy-peer-deps
          # Si package.json aún no trae Capacitor, se instala fijado a la serie 8 (nunca "latest").
          if [ ! -d node_modules/@capacitor/cli ]; then
            npm install --save-dev @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 --legacy-peer-deps
          fi
          npm run build

      - name: 6. Crear el proyecto Android con Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          # Permisos de GPS (solo si todavía no están)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' "$MANIFEST"
          fi

          # Copiar iconos de la aplicación
          if [ -d resources/android ]; then
            echo "Copiando iconos personalizados de la aplicación..."
            cp -r resources/android/* android/app/src/main/res/
          fi

          # Evita clases duplicadas de Kotlin entre módulos (solo si todavía no está)
          if ! grep -q "kotlin-stdlib-jdk7" android/build.gradle; then
            cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          fi

          npx cap sync android

      - name: 7. Compilar el APK con Gradle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 8. Publicar el APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Territorios-App
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
